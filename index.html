<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LE BUSINESS - Cartel</title>
    
    <!-- 🚨 DETECTEUR D'ERREURS POUR MOBILE 🚨 -->
    <script>
        window.onerror = function(msg, url, line) {
            document.body.innerHTML = '<div style="color:#ff4444; padding:20px; font-family:monospace; font-size:14px; background:#111; height:100vh; z-index:9999; position:relative;">' + 
            '<b>CRASH JAVASCRIPT :</b><br><br>' + msg + '<br><br><b>Fichier :</b> ' + url + '<br><b>Ligne :</b> ' + line + '</div>';
        };
    </script>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS & Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind.config.js"></script>
    
    <!-- Scripts (Attention : J'ai retiré les "js/" ici) -->
    <script src="jsaudio.js"></script>
    <script src="jsconstants.js"></script>
    <script src="jslogic.js"></script>
    
    <!-- Composants React -->
    <script type="text/babel" src="jsicons.jsx"></script>
    <script type="text/babel" src="jsApp.jsx"></script>
</head>
<body class="theme-normal screen-fx">
    <div id="root"></div>
</body>
</html>
